name: Build Protected Windows Installer

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14 for validation and native builds
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install validation and compiler dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "Nuitka>=4.3,<4.4"

      - name: Run regression simulation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          python validation\multi_device_simulation.py
          if ($LASTEXITCODE -ne 0) { throw "Regression simulation failed." }

      - name: Validate local external-runtime launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Get-Content "Start-KAFIANET-CONTROL-PRO.cmd" -Raw
          $powershellLauncher = Get-Content "Start-KAFIANET-CONTROL-PRO.ps1" -Raw
          $hiddenLauncher = Get-Content "Launch-KAFIA-NET-CONTROL-PRO.vbs" -Raw
          $bootstrap = Get-Content "kafianet_external_runtime.py" -Raw
          if ([regex]::IsMatch($launcher, '[^\x00-\x7F]')) {
            throw "CMD launcher must remain ASCII-only."
          }
          if (-not $launcher.Contains('Launch-KAFIA-NET-CONTROL-PRO.vbs') -or
              -not $launcher.Contains('wscript.exe')) {
            throw "CMD launcher does not start the hidden VBS launcher."
          }
          if ([regex]::IsMatch($powershellLauncher, '[^\x00-\x7F]') -or
              [regex]::IsMatch($hiddenLauncher, '[^\x00-\x7F]')) {
            throw "Windows launchers must remain ASCII-only."
          }
          if (-not $hiddenLauncher.Contains('shell.Run(command, 0, True)')) {
            throw "The VBS launcher must wait for the hidden PowerShell host."
          }
          if (-not $powershellLauncher.Contains('D:\games\py') -or
              $powershellLauncher.Contains('SERVER06\c$') -or
              -not $powershellLauncher.Contains('-c $bootstrapCommand')) {
            throw "PowerShell launcher must use local D:\games\py and the compiled bootstrap module."
          }
          if (-not $bootstrap.Contains('Path(r"D:\games\py")') -or
              -not $bootstrap.Contains('importlib.import_module("app_qml")')) {
            throw "Bootstrap does not use the local runtime and compiled app module."
          }
          if ($powershellLauncher -match 'Invoke-WebRequest|pip install|vc_redist') {
            throw "The launcher must not download or install runtime components."
          }
          $oldRuntimePath = '\\SERVER06\c$\العابي\222\66\الاخييير\py'
          if ($powershellLauncher.Contains($oldRuntimePath) -or
              $bootstrap.Contains($oldRuntimePath)) {
            throw "The obsolete shared Python runtime path remains in a launcher."
          }

      - name: Build and smoke-test protected application package
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          & ".\scripts\build-protected-package.ps1" -OutputDirectory "build\protected-package"
          if ($LASTEXITCODE -ne 0) { throw "Protected package builder failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Create protected installer definition
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          [Setup]
          AppId={{B4D7AD2E-9E10-4B2A-B1AA-5246A3B9D8F4}
          AppName=KAFIA NET CONTROL PRO
          AppVersion=1.2.0
          DefaultDirName={autopf}\KAFIA NET CONTROL PRO
          DefaultGroupName=KAFIA NET CONTROL PRO
          OutputDir=installer
          OutputBaseFilename=KAFIA_NET_CONTROL_PRO_Protected_Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          Uninstallable=yes

          [Files]
          Source: "build\protected-package\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{autodesktop}\KAFIA NET CONTROL PRO"; Filename: "{sys}\wscript.exe"; Parameters: """{app}\Launch-KAFIA-NET-CONTROL-PRO.vbs"""; WorkingDir: "{app}"
          Name: "{group}\KAFIA NET CONTROL PRO"; Filename: "{sys}\wscript.exe"; Parameters: """{app}\Launch-KAFIA-NET-CONTROL-PRO.vbs"""; WorkingDir: "{app}"

          [Run]
          Filename: "{sys}\wscript.exe"; Parameters: """{app}\Launch-KAFIA-NET-CONTROL-PRO.vbs"""; WorkingDir: "{app}"; Description: "Run KAFIA NET CONTROL PRO"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8

      - name: Build and verify protected installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $installer = Get-Item "installer\KAFIA_NET_CONTROL_PRO_Protected_Setup.exe"
          if ($installer.Length -gt 50000000) {
            throw "Protected installer exceeds 50 MB."
          }
          Write-Host ("Protected installer size: {0:N2} MB" -f ($installer.Length / 1MB))

      - name: Upload protected installer
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-Protected-Installer
          path: installer/KAFIA_NET_CONTROL_PRO_Protected_Setup.exe
