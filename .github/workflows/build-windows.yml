name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --clean --noconfirm KAFIA_NET_CONTROL_PRO.spec

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/KAFIA_NET_CONTROL_PRO" `
            -DestinationPath "KAFIA_NET_CONTROL_PRO-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-Windows
          path: KAFIA_NET_CONTROL_PRO-Windows.zip
