name: Build Windows EXE

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Run regression simulation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          python validation\multi_device_simulation.py

      - name: Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --clean --noconfirm KAFIA_NET_CONTROL_PRO.spec
          if (-not (Test-Path "dist\KAFIA_NET_CONTROL_PRO\KAFIA_NET_CONTROL_PRO.exe")) {
            throw "The packaged application executable was not produced."
          }

      - name: Smoke-test packaged Qt startup
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          & "dist\KAFIA_NET_CONTROL_PRO\KAFIA_NET_CONTROL_PRO.exe" --qt-import-smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged QtWidgets/QApplication smoke test failed with exit code $LASTEXITCODE."
          }

      - name: Download and verify Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path redist | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "redist\vc_redist.x64.exe" -TimeoutSec 90
          $signature = Get-AuthenticodeSignature "redist\vc_redist.x64.exe"
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "Microsoft Visual C++ Redistributable signature validation failed."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Create Installer script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          @'
          [Setup]
          AppName=KAFIA NET CONTROL PRO
          AppVersion=1.0.0
          DefaultDirName={autopf}\KAFIA NET CONTROL PRO
          DefaultGroupName=KAFIA NET CONTROL PRO
          OutputDir=installer
          OutputBaseFilename=KAFIA_NET_CONTROL_PRO_Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          Uninstallable=yes

          [Files]
          Source: "dist\KAFIA_NET_CONTROL_PRO\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          Source: "redist\vc_redist.x64.exe"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Icons]
          Name: "{autodesktop}\KAFIA NET CONTROL PRO"; Filename: "{app}\KAFIA_NET_CONTROL_PRO.exe"
          Name: "{group}\KAFIA NET CONTROL PRO"; Filename: "{app}\KAFIA_NET_CONTROL_PRO.exe"

          [Run]
          Filename: "{tmp}\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; StatusMsg: "Installing Microsoft Visual C++ Runtime..."; Flags: waituntilterminated
          Filename: "{app}\KAFIA_NET_CONTROL_PRO.exe"; Description: "تشغيل KAFIA NET CONTROL PRO"; Flags: nowait postinstall skipifsilent

          [Code]
          function IsVCRedistInstalled(): Boolean;
          var
            Installed: Cardinal;
          begin
            Result := RegQueryDWordValue(HKLM64, 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64', 'Installed', Installed) and (Installed = 1);
          end;
          '@ | Set-Content -Path installer.iss -Encoding UTF8

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-Windows
          path: installer/KAFIA_NET_CONTROL_PRO_Setup.exe
