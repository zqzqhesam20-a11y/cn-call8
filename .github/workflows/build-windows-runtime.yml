name: Build Windows App Update

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "PySide6==6.11.2" "psutil>=7,<8"

      - name: Prepare application update
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = "package\KAFIA_NET_CONTROL_PRO"

          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null

          Copy-Item "app_qml.py" "$appRoot\app_qml.py"
          Copy-Item "games.json" "$appRoot\games.json"
          Copy-Item "qml" "$appRoot\qml" -Recurse
          Copy-Item "engine" "$appRoot\engine" -Recurse
          Copy-Item "assets" "$appRoot\assets" -Recurse

          # Remove transient Python cache files if present.
          Get-ChildItem $appRoot -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem $appRoot -Recurse -File -Filter "*.pyc" |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Validate application package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = (Resolve-Path "package\KAFIA_NET_CONTROL_PRO").Path
          $env:PYTHONPATH = $appRoot

          python -c @"
          import sys
          import PySide6
          import psutil

          sys.path.insert(0, r"$appRoot")

          from engine.adb_engine import ADBEngine
          from engine.transfer_engine import TransferEngine
          from engine.path_manager import PathManager
          from engine.game_config import get_game, find_game_folder

          print("Python:", sys.version)
          print("PySide6:", PySide6.__version__)
          print("Application package:", r"$appRoot")
          print("External application imports: OK")
          "@

      - name: Create update package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Compress-Archive `
            -Path "package\KAFIA_NET_CONTROL_PRO" `
            -DestinationPath "KAFIA_NET_CONTROL_PRO_Update.zip" `
            -CompressionLevel Optimal

      - name: Report update size
        shell: pwsh
        run: |
          $appSize = (
            Get-ChildItem "package\KAFIA_NET_CONTROL_PRO" -Recurse -File |
            Measure-Object Length -Sum
          ).Sum

          $zipSize = (
            Get-Item "KAFIA_NET_CONTROL_PRO_Update.zip"
          ).Length

          Write-Host "=== APPLICATION SIZE ==="
          "{0:N2} MB" -f ($appSize / 1MB)

          Write-Host "=== UPDATE ZIP SIZE ==="
          "{0:N2} MB" -f ($zipSize / 1MB)

          Write-Host "=== FILES ==="
          Get-ChildItem "package\KAFIA_NET_CONTROL_PRO" -Recurse -File |
            Sort-Object FullName |
            Select-Object FullName, Length

      - name: Upload application update
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-Update
          path: KAFIA_NET_CONTROL_PRO_Update.zip
