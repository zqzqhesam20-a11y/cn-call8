name: Build External-Python Source Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for validation only
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies on the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression simulation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          python validation\multi_device_simulation.py

      - name: Prepare external-Python package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "KAFIA_NET_CONTROL_PRO"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "app_qml.py" "$stage\app_qml.py"
          Copy-Item "games.json" "$stage\games.json"
          Copy-Item "Start-KAFIANET-CONTROL-PRO.cmd" "$stage\Start-KAFIANET-CONTROL-PRO.cmd"
          Copy-Item "Start-KAFIANET-CONTROL-PRO.ps1" "$stage\Start-KAFIANET-CONTROL-PRO.ps1"
          Copy-Item "kafianet_external_runtime.py" "$stage\kafianet_external_runtime.py"
          Copy-Item "requirements.txt" "$stage\requirements.txt"
          Copy-Item "README.md" "$stage\README.md"

          foreach ($directory in @("engine", "qml", "assets", "ui")) {
            if (-not (Test-Path $directory -PathType Container)) {
              throw "Required application directory is missing: $directory"
            }
            Copy-Item $directory "$stage\$directory" -Recurse
          }

          New-Item -ItemType Directory -Force -Path "$stage\platform-tools" | Out-Null
          Copy-Item "platform-tools\adb.exe" "$stage\platform-tools\adb.exe"
          Copy-Item "platform-tools\AdbWinApi.dll" "$stage\platform-tools\AdbWinApi.dll"
          Copy-Item "platform-tools\AdbWinUsbApi.dll" "$stage\platform-tools\AdbWinUsbApi.dll"

          Get-ChildItem $stage -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force
          Get-ChildItem $stage -Recurse -File -Filter "*.pyc" |
            Remove-Item -Force

          $runtimeFiles = Get-ChildItem $stage -Recurse -File |
            Where-Object {
              $_.Name -match '^(python(?:w|3|3\d+)?\.exe|python(?:3|3\d+)?\.dll|vc_redist.*\.exe)$'
            }
          if ($runtimeFiles) {
            $runtimeFiles | ForEach-Object { Write-Error "Forbidden runtime file in payload: $($_.FullName)" }
            throw "Refusing to package Python/VC runtime files."
          }

          Write-Host "Verified: source application only; runtime remains external."
          Compress-Archive -Path "$stage\*" -DestinationPath "KAFIA_NET_CONTROL_PRO_ExternalPython.zip" -CompressionLevel Optimal -Force

          $archive = Get-Item "KAFIA_NET_CONTROL_PRO_ExternalPython.zip"
          if ($archive.Length -gt 50000000) {
            throw "External-Python source archive exceeds 50 MB; refusing to publish a package that may contain a runtime."
          }
          Write-Host ("Source-only package: {0:N2} MB" -f ($archive.Length / 1MB))

      - name: Upload external-Python source package
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-ExternalPython-Source
          path: KAFIA_NET_CONTROL_PRO_ExternalPython.zip
