name: Build Protected External-Python Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.14 for build and validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "Nuitka>=4.3,<4.4"

      - name: Run regression simulation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          python validation\multi_device_simulation.py
          if ($LASTEXITCODE -ne 0) { throw "Regression simulation failed." }

      - name: Build and smoke-test protected package
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          & ".\scripts\build-protected-package.ps1" -OutputDirectory "build\protected-package"
          if ($LASTEXITCODE -ne 0) { throw "Protected package builder failed." }

          $rawPython = Get-ChildItem "build\protected-package" -Recurse -File -Filter "*.py"
          $rawQml = Get-ChildItem "build\protected-package" -Recurse -File -Filter "*.qml"
          $rawJson = Get-ChildItem "build\protected-package" -Recurse -File -Filter "games.json"
          if ($rawPython -or $rawQml -or $rawJson) {
            throw "Raw Python/QML/game metadata leaked into the protected package."
          }

          Compress-Archive -Path "build\protected-package\*" -DestinationPath "KAFIA_NET_CONTROL_PRO_Protected.zip" -CompressionLevel Optimal -Force
          $archive = Get-Item "KAFIA_NET_CONTROL_PRO_Protected.zip"
          if ($archive.Length -gt 50000000) {
            throw "Protected ZIP exceeds the 50 MB distribution limit."
          }
          Write-Host ("Protected package size: {0:N2} MB" -f ($archive.Length / 1MB))

      - name: Upload protected package
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-Protected-Package
          path: KAFIA_NET_CONTROL_PRO_Protected.zip
