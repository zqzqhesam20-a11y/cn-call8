name: Build Windows App Installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "PySide6==6.11.2" "psutil>=7,<8"

      - name: Prepare application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = "package\KAFIA_NET_CONTROL_PRO"

          New-Item -ItemType Directory -Force -Path $appRoot | Out-Null

          Copy-Item "app_qml.py" "$appRoot\app_qml.py"
          Copy-Item "games.json" "$appRoot\games.json"
          Copy-Item "qml" "$appRoot\qml" -Recurse
          Copy-Item "engine" "$appRoot\engine" -Recurse
          Copy-Item "assets" "$appRoot\assets" -Recurse

          Get-ChildItem $appRoot -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem $appRoot -Recurse -File -Filter "*.pyc" |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Validate application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $appRoot = (Resolve-Path "package\KAFIA_NET_CONTROL_PRO").Path
          $env:PYTHONPATH = $appRoot

          python -c @"
          import sys
          import PySide6
          import psutil

          sys.path.insert(0, r"$appRoot")

          from engine.adb_engine import ADBEngine
          from engine.transfer_engine import TransferEngine
          from engine.path_manager import PathManager
          from engine.game_config import get_game, find_game_folder

          print("Python:", sys.version)
          print("PySide6:", PySide6.__version__)
          print("Application imports: OK")
          "@

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          @'
          [Setup]
          AppName=KAFIA NET CONTROL PRO
          AppVersion=1.0.0
          DefaultDirName=D:\games\programe files\KAFIA_NET_CONTROL_PRO
          DefaultGroupName=KAFIA NET CONTROL PRO
          OutputDir=installer
          OutputBaseFilename=KAFIA_NET_CONTROL_PRO_Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          Uninstallable=yes

          [Files]
          Source: "package\KAFIA_NET_CONTROL_PRO\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{autodesktop}\KAFIA NET CONTROL PRO"; Filename: "{app}\..\runtime\pythonw.exe"; Parameters: """{app}\app_qml.py"""; WorkingDir: "{app}"
          Name: "{group}\KAFIA NET CONTROL PRO"; Filename: "{app}\..\runtime\pythonw.exe"; Parameters: """{app}\app_qml.py"""; WorkingDir: "{app}"

          [Run]
          Filename: "{app}\..\runtime\pythonw.exe"; Parameters: """{app}\app_qml.py"""; WorkingDir: "{app}"; Description: "تشغيل KAFIA NET CONTROL PRO"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Report installer size
        shell: pwsh
        run: |
          $appSize = (
            Get-ChildItem "package\KAFIA_NET_CONTROL_PRO" -Recurse -File |
            Measure-Object Length -Sum
          ).Sum

          $installerSize = (
            Get-Item "installer\KAFIA_NET_CONTROL_PRO_Setup.exe"
          ).Length

          Write-Host "=== APPLICATION SIZE ==="
          "{0:N2} MB" -f ($appSize / 1MB)

          Write-Host "=== INSTALLER SIZE ==="
          "{0:N2} MB" -f ($installerSize / 1MB)

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KAFIA_NET_CONTROL_PRO-Installer
          path: installer/KAFIA_NET_CONTROL_PRO_Setup.exe
